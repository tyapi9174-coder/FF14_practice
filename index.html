<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FF14 Practice Simulator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="page-header">
        <h1>FF14 Raid Practice Simulator</h1>
        <h2 id="battle-timer">00.0</h2>
    </header>

    <!-- コンテンツ・フェーズ選択 -->
    <section class="setup-panel">
        <div class="setup-row">
            <label for="content-select">コンテンツ</label>

            <select id="content-select">
                <option value="ultimate-eden">
                    絶もうひとつの未来
                </option>
            </select>
        </div>

        <div class="phase-selector">
            <button class="phase-button" data-phase="P1">
                P1
            </button>

            <button class="phase-button" data-phase="P2">
                P2
            </button>

            <button class="phase-button active" data-phase="P3">
                P3
            </button>

            <button class="phase-button" data-phase="P4">
                P4
            </button>

            <button class="phase-button" data-phase="P5">
                P5
            </button>
        </div>

        <div id="phase-title">
            P3：時間圧縮・絶
        </div>

        <!-- フェーズごとに内容が変わる場所 -->
        <div id="phase-options"></div>
    </section>

    <main class="main-layout">

        <section class="party-panel">
            <h2>PARTY</h2>

            <div class="control-buttons">
                <button id="start-button">スタート</button>
                <button id="pause-button">一時停止</button>
                <button id="reset-button">リセット</button>
            </div>

            <div id="party-list"></div>
        </section>

        <section class="field-panel">
            <h2>FIELD</h2>

            <div class="field">
                <div id="player">
                    <span>YOU</span>
                </div>
            </div>
        </section>

    </main>

<script src="data/debuffData.js"></script>
<script src="data/phase3Patterns.js"></script>
<script src="script.js"></script>

</body>
</html>
